name: Atualizar anúncios (manual)

# A coleta diária agora roda na Hostinger (Web App Node.js, servidor/app.js), disparada pelo WordPress às 6h.
# No GitHub os sites da Soleon e da Degrau bloqueiam o acesso; este workflow fica só para rodar à mão, se precisar.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scraper/run.js
      - name: Publicar dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/lotes.json data/vitrine.json
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "dados: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
